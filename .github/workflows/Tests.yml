  # 12. Запуск по расписанию (ежедневная проверка зависимостей)
  scheduled-check:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Check for outdated dependencies
      run: |
        pip install pip-tools
        pip list --outdated

  # 7. Уведомления в telegram
  notify:
      needs: [test, docker-build]
      if: always()
      runs-on: ubuntu-latest

      steps:
        - name: Send notification to Telegram
          uses: appleboy/telegram-action@master
          with:
            to: ${{ secrets.TELEGRAM_CHAT_ID }}
            token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
            message: |
              ${{ github.workflow }} workflow ${{ job.status }}!
              
              Repository: ${{ github.repository }}
              Branch: ${{ github.ref_name }}
              Commit: ${{ github.sha }}
              
              👤 Author: ${{ github.actor }}
              📅 Event: ${{ github.event_name }}
              
              ${{ needs.test.result == 'success' && '✅ Tests passed' || '❌ Tests failed' }}
              ${{ needs.docker-build.result == 'success' && '✅ Build successful' || '❌ Build failed' }}
              
              View workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
