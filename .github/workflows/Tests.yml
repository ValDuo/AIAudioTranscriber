  # 14. Создание Docker образа
  docker-build:
    needs: test  # если есть job test, или укажи нужные зависимости
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    # ИСПРАВЛЕННЫЙ шаг!
    - name: Fix project structure for Docker
      run: |
        # Создаем правильную структуру пакета
        mkdir -p ai_audio_transcriber
        touch ai_audio_transcriber/__init__.py
        
        # Копируем Python файлы в пакет (исправленный синтаксис)
        for file in *.py; do
          if [ -f "$file" ]; then
            case "$file" in
              setup.py|setup_*.py|test*.py|*test*.py)
                # Пропускаем тестовые и setup файлы
                ;;
              *)
                echo "Копируем $file в ai_audio_transcriber/"
                cp "$file" ai_audio_transcriber/ 2>/dev/null || true
                ;;
            esac
          fi
        done
        
        echo "Структура после исправления:"
        find . -type f -name "*.py" | sort

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # ВАЖНО: ЯВНО указываем username!
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: dvdlera  # ← ЯВНО твой username, не переменная!
        password: ${{ secrets.DOCKER_PASSWORD }}

    # ВАЖНО: ЯВНЫЕ теги!
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: |
          dvdlera/ai-audio-transcriber:latest  
          dvdlera/ai-audio-transcriber:${{ github.sha }}
  # 6. Публикация пакета в PyPI
  publish-pypi:
    needs: docker-build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')  # ТОЛЬКО при тегах версий!

    steps:
    - name: Checkout code with tags
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        fetch-tags: true

    - name: Extract version from tag
      id: get_version
      run: |
        # Извлекаем версию из тега (v1.2.3 → 1.2.3)
        VERSION="${GITHUB_REF#refs/tags/v}"
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Extracted version: $VERSION"

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Clean up and prepare structure
      run: |
        echo "Удаляем конфликтующие файлы..."
        rm -f pyproject.toml setup.cfg 2>/dev/null || true
        
        echo "Создаем структуру пакета..."
        mkdir -p ai_audio_transcriber
        touch ai_audio_transcriber/__init__.py
        
        # Копируем основные файлы
        for file in *.py; do
          if [ -f "$file" ] && [ "$file" != "setup.py" ]; then
            if [[ ! "$file" =~ test ]] && [[ ! "$file" =~ Test ]]; then
              echo "Копируем $file в ai_audio_transcriber/"
              cp "$file" ai_audio_transcriber/
            fi
          fi
        done 2>/dev/null || true

    - name: Update version in setup.py
      run: |
        echo "Обновляем версию в setup.py..."
        if [ -f "setup.py" ]; then
          # Обновляем версию в setup.py
          sed -i "s/version=\".*\"/version=\"${{ steps.get_version.outputs.version }}\"/" setup.py
          echo "Текущий setup.py:"
          cat setup.py
        else
          # Создаем setup.py если его нет
          cat > setup.py << EOF
from setuptools import setup, find_packages

setup(
    name="ai-audio-transcriber",
    version="${{ steps.get_version.outputs.version }}",
    packages=find_packages(),
    install_requires=[
        "fastapi",
        "pydantic",
        "openai-whisper",
        "uvicorn",
        "ffmpeg-python",
    ],
    entry_points={
        "console_scripts": [
            "transcribe=ai_audio_transcriber.main:main",
        ],
    },
)
EOF
        fi

    - name: Install build tools
      run: |
        python -m pip install --upgrade pip
        pip install build wheel twine

    - name: Build package
      run: |
        echo "Сборка пакета версии ${{ steps.get_version.outputs.version }}..."
        python -m build

    - name: Check existing versions on PyPI
      id: check_pypi
      continue-on-error: true
      run: |
        echo "Проверяем существующие версии на PyPI..."
        # Проверяем доступность пакета на PyPI
        if curl -s "https://pypi.org/pypi/ai-audio-transcriber/json" | grep -q "\"${{ steps.get_version.outputs.version }}\""; then
          echo "Версия ${{ steps.get_version.outputs.version }} уже существует на PyPI"
          echo "already_exists=true" >> $GITHUB_OUTPUT
        else
          echo "Версия ${{ steps.get_version.outputs.version }} новая"
          echo "already_exists=false" >> $GITHUB_OUTPUT
        fi

    - name: Publish to PyPI
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
      run: |
        echo "Публикация версии ${{ steps.get_version.outputs.version }}..."
        # Используем --skip-existing чтобы пропустить существующие файлы
        python -m twine upload --skip-existing dist/* --verbose
        
        echo "Проверяем успешность загрузки..."
        sleep 5
        if curl -s "https://pypi.org/pypi/ai-audio-transcriber/${{ steps.get_version.outputs.version }}/json" | grep -q "info"; then
          echo "✅ Пакет успешно опубликован на PyPI!"
          echo "Ссылка: https://pypi.org/project/ai-audio-transcriber/${{ steps.get_version.outputs.version }}/"
        else
          echo "⚠️ Не удалось подтвердить публикацию. Проверьте PyPI."
        fi

  # # 15. Создание GitHub Release
  # create-release:
