name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * *'  # Ежедневно в полночь

env:
  REGISTRY: docker.io
  IMAGE_NAME: ${{ github.repository }}

jobs:


  # 2. Тестирование при PR
  test:
    runs-on: ubuntu-latest

    # if: github.event_name == 'pull_request'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-mock
        pip install -r requirements.txt
   

    - name: Install FFmpeg
      run: sudo apt-get update && sudo apt-get install -y ffmpeg

#    - name: Install package
#      run: pip install -e .

    - name: Run tests
      run: |
        pytest tests/autotests.py -v

  # 4. Проверка стиля кода
  lint:
    runs-on: ubuntu-latest
    # if: github.event_name == 'pull_request'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install linter
      run: pip install pylint black flake8

    - name: Run linters
      run: |
        echo "Running pylint..."
        pylint --rcfile=.pylintrc ./ || true
        echo "Running black check..."
        black --check . || true
        echo "Running flake8..."
        flake8 . || true

  # 3. и 5. Сборка проекта (мультиплатформенная)
  build:
    needs: [test, lint]
   # if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.11']

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install build wheel

    - name: Build package
      run: python -m build --wheel

    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: build-${{ matrix.os }}-py${{ matrix.python-version }}
        path: dist/
        retention-days: 7

  # 14. Создание Docker образа
  docker-build:
    needs: build
   # if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: |
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

  # 6. Публикация пакета в PyPI
  publish-pypi:
    needs: build
   # if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build wheel twine

    - name: Build package
      run: python -m build

    - name: Publish to PyPI
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
      run: python -m twine upload dist/*

  # 15. Создание GitHub Release
  create-release:
    needs: [build, docker-build]
  #  if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download build artifacts
      uses: actions/download-artifact@v4

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          *.whl
          *.tar.gz
        generate_release_notes: true

  # 8. Развертывание на GitHub Pages
  deploy:
    needs: build
  #  if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Build static site
      run: |
        # Здесь добавьте команды для сборки статического сайта
        echo "Building static site..."
        # Пример: npm run build

    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.TOKEN }}
        publish_dir: ./dist

  # 12. Запуск по расписанию (ежедневная проверка зависимостей)
  scheduled-check:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Check for outdated dependencies
      run: |
        pip install pip-tools
        pip list --outdated

  # 7. Уведомления в telegram
  notify:

      if: always()
      runs-on: ubuntu-latest

      steps:
        - name: Send notification to Telegram
          uses: appleboy/telegram-action@master
          with:
            to: ${{ secrets.TELEGRAM_CHAT_ID }}
            token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
            message: |
              ${{ github.workflow }} workflow ${{ job.status }}!
              
              Repository: ${{ github.repository }}
              Branch: ${{ github.ref_name }}
              Commit: ${{ github.sha }}
              
              👤 Author: ${{ github.actor }}
              📅 Event: ${{ github.event_name }}
              
              ${{ needs.test.result == 'success' && '✅ Tests passed' || '❌ Tests failed' }}
              ${{ needs.build.result == 'success' && '✅ Build successful' || '❌ Build failed' }}
              
              View workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
