name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * *'  # Ежедневно в полночь

env:
  REGISTRY: docker.io
  IMAGE_NAME: dvdlera/ai-audio-transcriber

jobs:


  # 2. Тестирование при PR
  test:
    runs-on: ubuntu-latest

    # if: github.event_name == 'pull_request'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-mock
        pip install -r requirements.txt
   

    - name: Install FFmpeg
      run: sudo apt-get update && sudo apt-get install -y ffmpeg


    - name: Run tests
      run: |
        pytest tests/autotests.py -v

  # 4. Проверка стиля кода
  lint:
    runs-on: ubuntu-latest
    # if: github.event_name == 'pull_request'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install linter
      run: pip install pylint black flake8

    - name: Run linters
      run: |
        echo "Running pylint..."
        pylint --rcfile=.pylintrc ./ || true
        echo "Running black check..."
        black --check . || true
        echo "Running flake8..."
        flake8 . || true

  # 3. и 5. Сборка проекта (мультиплатформенная)
  # build:
  #   needs: [test, lint]
  #  # if: github.event_name == 'push' && github.ref == 'refs/heads/main'
