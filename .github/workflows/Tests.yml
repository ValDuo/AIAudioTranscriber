name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * *'  # Ежедневно в полночь

env:
  REGISTRY: docker.io
  IMAGE_NAME: dvdlera/ai-audio-transcriber

jobs:


  # 2. Тестирование при PR
  test:
    runs-on: ubuntu-latest

    # if: github.event_name == 'pull_request'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-mock
        pip install -r requirements.txt
   

    - name: Install FFmpeg
      run: sudo apt-get update && sudo apt-get install -y ffmpeg


    - name: Run tests
      run: |
        pytest tests/autotests.py -v

  # 4. Проверка стиля кода
  lint:
    runs-on: ubuntu-latest
    # if: github.event_name == 'pull_request'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install linter
      run: pip install pylint black flake8

    - name: Run linters
      run: |
        echo "Running pylint..."
        pylint --rcfile=.pylintrc ./ || true
        echo "Running black check..."
        black --check . || true
        echo "Running flake8..."
        flake8 . || true

  # 3. и 5. Сборка проекта (мультиплатформенная)
  # build:
  #   needs: [test, lint]
  #  # if: github.event_name == 'push' && github.ref == 'refs/heads/main'
  #   strategy:
  #     matrix:
  #       os: [ubuntu-latest]
  #       python-version: ['3.11']

  #   runs-on: ${{ matrix.os }}

  #   steps:
  #   - name: Checkout code
  #     uses: actions/checkout@v4
  #     with:
  #       submodules: recursive

  #   - name: Set up Python ${{ matrix.python-version }}
  #     uses: actions/setup-python@v5
  #     with:
  #       python-version: ${{ matrix.python-version }}

  #   - name: Install dependencies
  #     run: |
  #       python -m pip install --upgrade pip
  #       pip install -r requirements.txt
  #       pip install build wheel

  #   - name: Build package
  #     run: python -m build --wheel

  #   - name: Upload build artifact
  #     uses: actions/upload-artifact@v4
  #     with:
  #       name: build-${{ matrix.os }}-py${{ matrix.python-version }}
  #       path: dist/
  #       retention-days: 7

  # 14. Создание Docker образа
  docker-build:
    needs: test  # если есть job test, или укажи нужные зависимости
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    # ИСПРАВЛЕННЫЙ шаг!
    - name: Fix project structure for Docker
      run: |
        # Создаем правильную структуру пакета
        mkdir -p ai_audio_transcriber
        touch ai_audio_transcriber/__init__.py
        
        # Копируем Python файлы в пакет (исправленный синтаксис)
        for file in *.py; do
          if [ -f "$file" ]; then
            case "$file" in
              setup.py|setup_*.py|test*.py|*test*.py)
                # Пропускаем тестовые и setup файлы
                ;;
              *)
                echo "Копируем $file в ai_audio_transcriber/"
                cp "$file" ai_audio_transcriber/ 2>/dev/null || true
                ;;
            esac
          fi
        done
        
        echo "Структура после исправления:"
        find . -type f -name "*.py" | sort

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # ВАЖНО: ЯВНО указываем username!
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: dvdlera  # ← ЯВНО твой username, не переменная!
        password: ${{ secrets.DOCKER_PASSWORD }}

    # ВАЖНО: ЯВНЫЕ теги!
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: |
          dvdlera/ai-audio-transcriber:latest  
          dvdlera/ai-audio-transcriber:${{ github.sha }}
  # 6. Публикация пакета в PyPI
  publish-pypi:
    needs: docker-build
    runs-on: ubuntu-latest
    # if: startsWith(github.ref, 'refs/tags/v')  # Раскомментируй когда будешь готовить релиз

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    
    - name: Clean up configuration files
      run: |
        echo "Удаляем проблемные файлы..."
        rm -f pyproject.toml setup.cfg 2>/dev/null || true
        
        echo "Создаем правильную структуру..."
        mkdir -p ai_audio_transcriber
        touch ai_audio_transcriber/__init__.py
        
        # Копируем основные файлы
        for file in *.py; do
          if [ -f "$file" ] && [ "$file" != "setup.py" ]; then
            if [[ ! "$file" =~ test ]] && [[ ! "$file" =~ Test ]]; then
              echo "Копируем $file в ai_audio_transcriber/"
              cp "$file" ai_audio_transcriber/
            fi
          fi
        done 2>/dev/null || true

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build wheel twine

    - name: Build package
      run: |
        echo "Проверяем структуру..."
        find . -name "*.py" | sort
        echo ""
        python -m build

    - name: Publish to PyPI
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
      run: python -m twine upload dist/*


  # 15. Создание GitHub Release
  create-release:
    needs: docker-build
    if: startsWith(github.ref, 'refs/tags/v')  
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code with tags
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Получаем все коммиты и теги
        fetch-tags: true  # Скачиваем все теги

    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        pattern: build-*  # Скачиваем все артефакты сборки
        merge-multiple: true  # Объединяем артефакты из разных jobs

    - name: Get version from tag
      id: get_version
      run: |
        # Извлекаем номер версии из тега (убираем 'v' в начале)
        VERSION="${GITHUB_REF#refs/tags/v}"
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Tag version: $VERSION"

    - name: List downloaded artifacts
      run: |
        echo "Скачанные артефакты:"
        find . -type f -name "*.whl" -o -name "*.tar.gz" -o -name "*.zip" | sort
        ls -la

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Обязательно!
      with:
        tag_name: ${{ github.ref_name }}  # Используем имя тега
        name: Release ${{ steps.get_version.outputs.version }}  # Имя релиза
        body: |
          # AI Audio Transcriber ${{ steps.get_version.outputs.version }}
          
          ## Что нового
          - Автоматическая транскрибация аудио с помощью модели Whisper
          - FastAPI REST API сервис
          - Интеграция с платформой 1С
          
          ## Docker образ
          ```bash
          docker pull dvdlera/ai-audio-transcriber:${{ steps.get_version.outputs.version }}
          ```
          
          ## Установка через pip
          ```bash
          pip install ai-audio-transcriber==${{ steps.get_version.outputs.version }}
          ```
          
          ## Ссылки
          - [Документация](https://github.com/${{ github.repository }}/wiki)
          - [Docker Hub](https://hub.docker.com/r/dvdlera/ai-audio-transcriber)
          
          ## Автоматически сгенерированные заметки:
          ${{ github.event.release.body }}
        draft: false  # Публичный релиз
        prerelease: false  # Стабильная версия
        generate_release_notes: true  # Автогенерация changelog
        files: |
          *.whl
          *.tar.gz
          *.zip


  # 12. Запуск по расписанию (ежедневная проверка зависимостей)
 scheduled-check:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Check for outdated dependencies
      run: |
        pip install pip-tools
        pip list --outdated

  # 7. Уведомления в telegram
  notify:
      needs: [test, docker-build]
      if: always()
      runs-on: ubuntu-latest

      steps:
        - name: Send notification to Telegram
          uses: appleboy/telegram-action@master
          with:
            to: ${{ secrets.TELEGRAM_CHAT_ID }}
            token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
            message: |
              ${{ github.workflow }} workflow ${{ job.status }}!
              
              Repository: ${{ github.repository }}
              Branch: ${{ github.ref_name }}
              Commit: ${{ github.sha }}
              
              👤 Author: ${{ github.actor }}
              📅 Event: ${{ github.event_name }}
              
              ${{ needs.test.result == 'success' && '✅ Tests passed' || '❌ Tests failed' }}
              ${{ needs.build.result == 'success' && '✅ Build successful' || '❌ Build failed' }}
              
              View workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
